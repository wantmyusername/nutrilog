name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Armar carpeta de despliegue
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R dist/. deploy/
          mkdir -p deploy/api
          rsync -a --exclude 'data' --exclude 'config.local.php' api/ deploy/api/

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/config.local.php
            **/data/**
            **/.DS_Store
